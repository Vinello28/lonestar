name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare release version and updater signing config
        id: prepare_release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const ref = process.env.GITHUB_REF || "";
            const refName = process.env.GITHUB_REF_NAME || "";
            if (ref.startsWith("refs/tags/v")) {
              const version = refName.replace(/^v/i, "");
              if (version) {
                for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
                  const json = JSON.parse(fs.readFileSync(file, "utf8"));
                  json.version = version;
                  fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
                }
                const cargo = fs.readFileSync("Cargo.toml", "utf8").replace(
                  /^(\[workspace\.package\][\s\S]*?^\s*version\s*=\s*")[^"]*(")/m,
                  `$1${version}$2`
                );
                fs.writeFileSync("Cargo.toml", cargo);
                const tauriCargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
                if (/^version\s*=\s*"/m.test(tauriCargo)) {
                  fs.writeFileSync(
                    "src-tauri/Cargo.toml",
                    tauriCargo.replace(/^(version\s*=\s*")[^"]*(")/m, `$1${version}$2`)
                  );
                }
                console.log(`Synced project version to ${version}`);
              }
            }
            const hasSigningKey = Boolean((process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim());
            if (!hasSigningKey) {
              const tauriConfPath = "src-tauri/tauri.conf.json";
              const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
              if (tauriConf.bundle) {
                tauriConf.bundle.createUpdaterArtifacts = false;
              }
              fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2) + "\n");
              console.log("TAURI_SIGNING_PRIVATE_KEY not set: disabled bundle.createUpdaterArtifacts for this build.");
            } else {
              console.log("TAURI_SIGNING_PRIVATE_KEY detected: updater signing enabled.");
            }
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_signing_key=${hasSigningKey}\n`);
            }
          '

      - name: Build and publish Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'LoneStar v__VERSION__'
          releaseBody: 'Cross-platform release of LoneStar — Native iStar 2.0 (i*) Modeling Studio built with Rust (Tauri v2) & Svelte 5.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.prepare_release.outputs.has_signing_key == 'true' }}
          args: ${{ matrix.args }}
