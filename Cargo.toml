[workspace]
members = ["crates/lonestar-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["LoneStar Contributors"]
repository = "https://github.com/lonestar-istar/lonestar"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
